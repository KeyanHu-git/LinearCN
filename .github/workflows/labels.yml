name: Sync labels

on:
  push:
    branches: [main]
    paths:
      - ".github/labels.json"
      - "scripts/sync-github-labels.mjs"
      - ".github/workflows/labels.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate and synchronize labels
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/sync-github-labels.mjs --check
          node scripts/sync-github-labels.mjs
