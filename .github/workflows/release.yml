name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate and test
        run: |
          npm run generate
          npm test
          npm run audit
          npm run build
          npm run test:packages

      - name: Package release files
        shell: bash
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          NODE_VERSION=22.12.0
          WINDOWS_DIR="dist/$VERSION/windows-desktop"
          npm --prefix "$WINDOWS_DIR" install --omit=dev --ignore-scripts --no-audit --no-fund
          curl -fsSLO "https://nodejs.org/dist/v$NODE_VERSION/node-v$NODE_VERSION-win-x64.zip"
          curl -fsSLO "https://nodejs.org/dist/v$NODE_VERSION/SHASUMS256.txt"
          EXPECTED=$(awk -v file="node-v$NODE_VERSION-win-x64.zip" '$2 == file { print $1 }' SHASUMS256.txt)
          echo "$EXPECTED  node-v$NODE_VERSION-win-x64.zip" | sha256sum -c -
          unzip -q "node-v$NODE_VERSION-win-x64.zip"
          mkdir -p "$WINDOWS_DIR/runtime"
          cp "node-v$NODE_VERSION-win-x64/node.exe" "$WINDOWS_DIR/runtime/node.exe"
          cp "node-v$NODE_VERSION-win-x64/LICENSE" "$WINDOWS_DIR/runtime/NODE_LICENSE"
          mkdir -p release
          (cd "dist/$VERSION/chromium" && zip -r "../../../release/LinearCN-$VERSION-chromium.zip" .)
          (cd "dist/$VERSION/firefox" && zip -r "../../../release/LinearCN-$VERSION-firefox.zip" .)
          (cd "dist/$VERSION/windows-desktop" && zip -r "../../../release/LinearCN-$VERSION-windows-desktop-installer.zip" .)
          (cd "dist/$VERSION/macos" && zip -r "../../../release/LinearCN-$VERSION-macOS.zip" .)
          cp "dist/$VERSION/userscript/LinearCN.user.js" "release/LinearCN-$VERSION.user.js"
          cp "dist/$VERSION/COMPATIBILITY.md" release/

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release/* \
            --title "LinearCN ${GITHUB_REF_NAME}" \
            --generate-notes

      - name: Refresh existing release assets
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          gh release upload "v$VERSION" release/* --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: LinearCN
          path: release/
