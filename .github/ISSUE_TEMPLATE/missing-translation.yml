name: 漏译报告
description: 报告未被汉化的 Linear 页面或弹层
title: "[漏译] "
labels: ["type:translation", "area:dictionary", "status:needs-triage"]
body:
  - type: input
    id: path
    attributes:
      label: 页面或入口
      placeholder: 例如 设置 → 安全、Agent 首页、帮助菜单
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: 英文原文
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: 截图
      description: 请先遮挡账号、工作区和其他敏感信息。
  - type: dropdown
    id: platform
    attributes:
      label: 平台
      options:
        - Linear Windows 桌面端
        - Chromium 浏览器
        - Firefox
        - Safari / Userscript
    validations:
      required: true
