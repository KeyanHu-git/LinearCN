name: 功能建议
description: 提议新的平台支持、翻译能力或维护工具
title: "[建议] "
labels: ["type:enhancement", "status:needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请先说明当前工作流为什么不够用。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 说明期望行为、使用入口和适用平台。
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: 边界与替代方案
      description: 可选。说明不应改变的行为或已经尝试过的方法。
